# Send prefix
unbind-key C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Terminal capabilities
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set-option -g default-terminal tmux-256color' \
  'set-option -g default-terminal screen-256color'
set-option -as terminal-overrides ',xterm*:Tc'
set-option -s set-clipboard external

# Use Alt-arrow keys to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left previous-window
bind -n S-Right next-window

# Mouse mode
setw -g mouse on

# Set easier window split keys
bind-key v split-window -h
bind-key h split-window -v

# Easy config reload
bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded."

# Theme
set-window-option -g window-status-current-style bold,bg=blue,fg=colour234
set-window-option -g window-status-style fg=colour35
set -g window-status-activity-style bold,bg=colour234,fg=white
set-option -g message-style bg=colour237,fg=colour231
set-option -g pane-border-style fg=colour36
set-option -g pane-active-border-style fg=colour35

# Status Bar
set -g status-justify centre
set -g status-style bg=black,fg=colour35
set -g status-interval 60
set -g status-left-length 50
set -g status-left "#[bg=colour35]💻#[fg=colour234,bold] #H#[nobold] [#S] "
set -g status-right '#[bg=colour35] 🕔 #[fg=colour234,bold]%H:%M '
